name: Deploy

# Manual only, deliberately.
#
# A deploy here runs D1 migrations against the production database, and a
# migration is the one thing in this pipeline that cannot be rolled back by
# redeploying the previous commit. Someone should be watching when it happens.
# CI (.github/workflows/ci.yml) is what gates merges; this is what ships them.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Re-run the gate here rather than trusting that CI ran on this commit: a
      # manual dispatch can target any ref, including one that never opened a PR.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Must precede the deploy: `wrangler deploy` uploads ./dist/client as the
      # [assets] directory, and an unbuilt directory ships a Worker whose every
      # script and stylesheet 404s.
      - name: Build client bundles
        run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply saloona --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Cheapest possible proof that the thing that just shipped is serving.
      - name: Smoke check
        run: |
          set -euo pipefail
          BASE=https://saloona-saas.roshaanraza3.workers.dev

          for path in / /pricing /login /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${BASE}${path}")
            echo "${path} -> ${code}"
            test "${code}" = "200"
          done

          # Exercise the password path, which none of the pages above do.
          #
          # A deploy once passed every check here while signup and login returned
          # 500 for every user on production: the hash used more PBKDF2 iterations
          # than the deployed runtime permits, and nothing that renders a page
          # touches PBKDF2. This posts credentials that cannot match anything and
          # expects a clean 401 — the login route derives a hash even when the
          # address is unknown, so an unsupported iteration count surfaces as a
          # 500 right here instead of on a salon owner's first sign-in.
          #
          # 429 is accepted because the login rate limiter is shared across
          # deploys and a burst of runs can legitimately trip it; that is still
          # the Worker answering rather than falling over.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${BASE}/api/auth/login" \
            -H 'content-type: application/json' \
            -H "origin: ${BASE}" \
            -d '{"email":"smoke-check@invalid.test","password":"not-a-real-password"}')
          echo "POST /api/auth/login -> ${code}"
          test "${code}" = "401" || test "${code}" = "429"
