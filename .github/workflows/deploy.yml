name: Deploy

# Manual only, deliberately.
#
# A deploy here runs D1 migrations against the production database, and a
# migration is the one thing in this pipeline that cannot be rolled back by
# redeploying the previous commit. Someone should be watching when it happens.
# CI (.github/workflows/ci.yml) is what gates merges; this is what ships them.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Re-run the gate here rather than trusting that CI ran on this commit: a
      # manual dispatch can target any ref, including one that never opened a PR.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Must precede the deploy: `wrangler deploy` uploads ./dist/client as the
      # [assets] directory, and an unbuilt directory ships a Worker whose every
      # script and stylesheet 404s.
      - name: Build client bundles
        run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply saloona --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Cheapest possible proof that the thing that just shipped is serving.
      - name: Smoke check
        run: |
          set -euo pipefail
          BASE=https://saloona.shop

          # Wait for the hostname to actually be served by this Worker.
          #
          # Attaching a custom domain is not instant, and until it resolves the
          # name still answers from whatever was there before — which in this
          # zone was a hosting placeholder that returns 200 at `/`. A plain
          # check of `/` therefore cannot tell "the Worker is live" from "the
          # old page is still up", and the first attach failed exactly that way.
          #
          # /pricing is the discriminator: this Worker serves it, and nothing
          # else on this hostname ever did.
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${BASE}/pricing" || echo 000)
            if [ "${code}" = "200" ]; then
              echo "custom domain serving after ${attempt} attempt(s)"
              break
            fi
            if [ "${attempt}" = "30" ]; then
              echo "::error::${BASE}/pricing still returning ${code} after 30 attempts — custom domain is not attached"
              exit 1
            fi
            sleep 10
          done

          for path in / /pricing /login /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${BASE}${path}")
            echo "${path} -> ${code}"
            test "${code}" = "200"
          done

          # Exercise the password path, which none of the pages above do.
          #
          # A deploy once passed every check here while signup and login returned
          # 500 for every user on production: the hash used more PBKDF2 iterations
          # than the deployed runtime permits, and nothing that renders a page
          # touches PBKDF2. This posts credentials that cannot match anything and
          # expects a clean 401 — the login route derives a hash even when the
          # address is unknown, so an unsupported iteration count surfaces as a
          # 500 right here instead of on a salon owner's first sign-in.
          #
          # 429 is accepted because the login rate limiter is shared across
          # deploys and a burst of runs can legitimately trip it; that is still
          # the Worker answering rather than falling over.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${BASE}/api/auth/login" \
            -H 'content-type: application/json' \
            -H "origin: ${BASE}" \
            -d '{"email":"smoke-check@invalid.test","password":"not-a-real-password"}')
          echo "POST /api/auth/login -> ${code}"
          test "${code}" = "401" || test "${code}" = "429"

          # www must redirect to the apex, not answer with its own copy of the
          # site. Two hostnames serving identical pages is duplicate content,
          # and this is the only check that would notice the redirect being
          # dropped — every page check above requests the apex directly.
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.saloona.shop/pricing")
          location=$(curl -s -o /dev/null -w '%{redirect_url}' "https://www.saloona.shop/pricing")
          echo "www/pricing -> ${code} ${location}"
          test "${code}" = "301"
          test "${location}" = "https://saloona.shop/pricing"
