name = "saloona-saas"
main = "src/server/index.ts"
# Pinned to a date the installed workerd actually supports. A compatibility date
# ahead of the local runtime binary fails to start — `wrangler dev` and the test
# pool both refuse to boot — and there is nothing to gain by leading it, since
# this Worker declares no compatibility_flags. Raise it deliberately, together
# with the same value in vitest.config.ts.
compatibility_date = "2026-08-22"
workers_dev = true

[observability]
enabled = true

# Built by `npm run build:client`. Serving the bundles from Cloudflare's asset
# store rather than the Worker keeps them off the request path entirely.
#
# Both handling options are off deliberately. Every HTML page in this app is
# rendered by the Worker, so an asset lookup that "helpfully" resolves /app to
# an /app.html that does not exist, or answers a miss with its own 404 page,
# would shadow real routes. Exact matches only; everything else falls through.
[assets]
directory = "./dist/client"
html_handling = "none"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "saloona"
database_id = "7b38c132-6a23-4d89-a3f2-08a72b2ae079"
migrations_dir = "migrations"

# The automation engine. Without these the reminder, birthday, win-back and
# review-request features exist in the database and never fire.
#
#   */5  drains the outbound WhatsApp queue
#   0 *  wakes hourly so each organization's daily 09:00 run happens at 09:00 in
#        its own timezone, not in UTC
[triggers]
crons = ["*/5 * * * *", "0 * * * *"]

[vars]
APP_ENV = "production"
# The canonical public origin. Every absolute URL the Worker builds comes from
# here: canonical tags, OG tags, the Organization block in structured data, the
# join link printed on a salon's QR poster, and the link inside every WhatsApp
# message. A QR code is printed once and sits on a reception desk for months, so
# changing this later strands the posters already out in the world.
#
# STILL ON workers.dev ON PURPOSE. saloona.shop is registered but has no
# nameservers yet, so the zone does not exist and the name does not resolve.
# Pointing canonical tags, OG tags and every QR link at a domain that answers
# nothing is strictly worse than this URL. Switch both this and the smoke-check
# BASE in deploy.yml together, in one commit, once `dig saloona.shop` returns an
# address — and add the custom-domain routes below at the same time:
#
#   routes = [
#     { pattern = "saloona.shop", custom_domain = true },
#     { pattern = "www.saloona.shop", custom_domain = true }
#   ]
BASE_URL = "https://saloona-saas.roshaanraza3.workers.dev"
